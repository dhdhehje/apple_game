      --bg-cream: #fffbee;
      --board-bg: #fff3e0;
      --accent-orange: #ff9800;
      --accent-shadow: #e65100;
      --text-color: #3e2723;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Jua', 'Nunito', sans-serif;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* 상단 헤더 & 컨트롤 */
    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2.3rem;
      color: #d84315;
      text-shadow: 2px 2px 0px #ffe0b2, 3px 3px 0px #ffcc80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #6d4c41;
      margin-top: 3px;
    }

    /* 점수판 & 타이머 대시보드 */
    .dashboard {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 10px 24px;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      border: 3px solid #ffb74d;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #8d6e63;
    }

    .stat-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #e65100;
      font-family: 'Nunito', 'Jua', sans-serif;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 14px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    .btn-pause {
      background: #ffa726;
      color: #fff;
    }
    .btn-pause:hover { background: #fb8c00; }

    .btn-restart {
      background: #e53935;
      color: #fff;
    }
    .btn-restart:hover { background: #d32f2f; }

    .btn-rank {
      background: #8e24aa;
      color: white;
    }
    .btn-rank:hover { background: #7b1fa2; }

    /* 게임 캔버스/보드 컨테이너 */
    .game-wrapper {
      position: relative;
      background: var(--board-bg);
      border: 6px solid #ffa726;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(230, 81, 0, 0.15);
      touch-action: none;
    }

    #game-board {
      display: grid;
      grid-template-columns: repeat(10, 44px);
      grid-template-rows: repeat(17, 44px);
      gap: 4px;
      position: relative;
      cursor: crosshair;
    }

    /* 햄버거 아이템 */
    .apple {
      width: 44px;
      height: 44px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-family: 'Nunito', 'Jua', sans-serif;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 
        -2px -2px 0 #3e2723,  
         2px -2px 0 #3e2723,
        -2px  2px 0 #3e2723,
         2px  2px 0 #3e2723,
         0px 2px 5px rgba(0,0,0,0.85);
      border-radius: 12px;
      background-image: var(--burger-img);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.25s ease;
    }

    /* 드래그 선택 상태 */
    .apple.selected {
      transform: scale(1.12);
      filter: brightness(1.2) drop-shadow(0 0 7px rgba(255, 152, 0, 0.95));
      outline: 3px solid #ff9100;
      border-radius: 12px;
      z-index: 2;
    }

    /* 햄버거 제거 애니메이션 */
    .apple.popping {
      animation: popOut 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popOut {
      0% { transform: scale(1.12); opacity: 1; }
      50% { transform: scale(1.4) rotate(12deg); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    .apple.cleared {
      visibility: hidden;
      pointer-events: none;
    }

    /* 드래그 영역 오버레이 사각형 */
    #selection-box {
      position: absolute;
      border: 2px dashed #e65100;
      background: rgba(255, 152, 0, 0.25);
      border-radius: 10px;
      pointer-events: none;
      display: none;
      z-index: 10;
    }

    /* 플로팅 현재 합계 배지 */
    #sum-indicator {
      position: absolute;
      background: #2e7d32;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 20;
      transform: translate(-50%, -130%);
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    #sum-indicator.is-ten {
      background: #d84315;
      animation: pulse 0.4s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translate(-50%, -130%) scale(1); }
      to { transform: translate(-50%, -130%) scale(1.15); }
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      border-radius: 26px;
      padding: 26px 30px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border: 4px solid #ffb74d;
      transform: translateY(20px);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.7rem;
      color: #d84315;
      margin-bottom: 12px;
    }

    .rank-list {
      list-style: none;
      margin: 16px 0;
      text-align: left;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 7px 12px;
      margin-bottom: 6px;
      background: #fff8e1;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .rank-item:first-child {
      background: #ffe082;
      font-weight: bold;
    }

    .overlay-action-btn {
      background: #ff9800;
      color: white;
      padding: 10px 24px;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    .overlay-action-btn:hover {
      background: #f57c00;
    }

    /* 콤보 / 이펙트 알림 */
    .toast-effect {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      color: #e65100;
      font-size: 2.2rem;
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(255,255,255,0.9), 2px 2px 0 #fff;
      pointer-events: none;
      opacity: 0;
      z-index: 30;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast-effect.show {
      transform: translate(-50%, -80%) scale(1.2);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍔 맛있는 햄버거 게임! 🍟</h1>
    <p class="subtitle">드래그한 햄버거들의 숫자 합이 <b>10</b>이 되면 맛있게 얌얌!</p>
  </header>

  <div class="dashboard">
    <div class="stat-badge">
      <span class="stat-label">남은 시간</span>
      <span class="stat-val" id="timer-display">120</span>
    </div>
    <div class="stat-badge">
      <span class="stat-label">현재 점수</span>
      <span class="stat-val" id="score-display">0</span>
    </div>
    <div class="stat-badge">
      <span class="stat-label">남은 버거</span>
      <span class="stat-val" id="remaining-display">170</span>
    </div>
    <div class="btn-group">
      <button class="btn-pause" id="pause-btn">⏸ 일시정지</button>
      <button class="btn-restart" id="restart-btn">🔄 다시하기</button>
      <button class="btn-rank" id="rank-btn">🏆 랭킹</button>
    </div>
  </div>

  <div class="game-wrapper">
    <div id="game-board"></div>
    <div id="selection-box"></div>
    <div id="sum-indicator">합: 0</div>
    <div id="toast-effect" class="toast-effect">⭐ +10! ⭐</div>
  </div>

  <!-- 일시정지 모달 -->
  <div class="modal-overlay" id="pause-modal">
    <div class="modal-card">
      <h2 class="modal-title">⏸ 일시정지</h2>
      <p style="color:#6d4c41; margin-bottom:16px;">잠시 쉬어가는 중이에요!</p>
      <button class="overlay-action-btn" id="resume-btn">▶ 계속하기</button>
    </div>
  </div>

  <!-- 게임 오버 모달 -->
  <div class="modal-overlay" id="gameover-modal">
    <div class="modal-card">
      <h2 class="modal-title">🎉 시간 종료! 🎉</h2>
      <p style="font-size:1.1rem; color:#5d4037; margin-bottom: 6px;">최종 획득 점수</p>
      <p style="font-size:2.4rem; color:#d84315; font-weight:900; margin-bottom: 12px;" id="final-score">0점</p>
      <p id="high-score-msg" style="color: #e65100; font-weight: bold; margin-bottom: 16px;"></p>
      <button class="overlay-action-btn" id="play-again-btn">다시 도전하기 ✨</button>
    </div>
  </div>

  <!-- 랭킹 모달 -->
  <div class="modal-overlay" id="ranking-modal">
    <div class="modal-card">
      <h2 class="modal-title">🏆 명예의 전당 TOP 5</h2>
      <ul class="rank-list" id="ranking-list">
        <!-- 랭킹 항목이 동적으로 삽입됨 -->
      </ul>
      <button class="overlay-action-btn" style="background:#8d6e63;" id="close-rank-btn">닫기</button>
    </div>
  </div>

  <script>
    // --- 설정 변수 ---
    const ROWS = 17;
    const COLS = 10;
    const TOTAL_BURGERS = ROWS * COLS;
    const TOTAL_TIME = 120;

    // --- 게임 상태 ---
    let apples = []; // { id, row, col, value, cleared, element }
    let score = 0;
    let timeLeft = TOTAL_TIME;
    let isPaused = false;
    let isGameOver = false;
    let timerInterval = null;

    // 드래그 상태
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let selectedApples = [];

    // DOM 참조
    const boardEl = document.getElementById('game-board');
    const selectBoxEl = document.getElementById('selection-box');
    const sumIndicatorEl = document.getElementById('sum-indicator');
    const timerDisplay = document.getElementById('timer-display');
    const scoreDisplay = document.getElementById('score-display');
    const remainingDisplay = document.getElementById('remaining-display');
    const pauseBtn = document.getElementById('pause-btn');
    const restartBtn = document.getElementById('restart-btn');
    const rankBtn = document.getElementById('rank-btn');
    const toastEffect = document.getElementById('toast-effect');

    // 모달 DOM
    const pauseModal = document.getElementById('pause-modal');
    const resumeBtn = document.getElementById('resume-btn');
    const gameoverModal = document.getElementById('gameover-modal');
    const finalScoreEl = document.getElementById('final-score');
    const highScoreMsg = document.getElementById('high-score-msg');
    const playAgainBtn = document.getElementById('play-again-btn');
    const rankingModal = document.getElementById('ranking-modal');
    const rankingList = document.getElementById('ranking-list');
    const closeRankBtn = document.getElementById('close-rank-btn');

    // --- Web Audio 효과음 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = 'sine', duration = 0.12, gainVal = 0.15) {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundSuccess() {
      playTone(523.25, 'triangle', 0.08); // C5
      setTimeout(() => playTone(659.25, 'triangle', 0.08), 70); // E5
      setTimeout(() => playTone(783.99, 'triangle', 0.12), 140); // G5
      setTimeout(() => playTone(1046.50, 'triangle', 0.2), 210); // C6
    }

    // --- 게임 초기화 ---
    function initGame() {
      clearInterval(timerInterval);
      boardEl.innerHTML = '';
      apples = [];
      score = 0;
      timeLeft = TOTAL_TIME;
      isPaused = false;
      isGameOver = false;

      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      remainingDisplay.textContent = TOTAL_BURGERS;
      pauseBtn.textContent = '⏸ 일시정지';

      hideModals();

      // 버거 생성 (1~9 사이의 숫자 균등/랜덤 분배)
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const val = Math.floor(Math.random() * 9) + 1;
          const appleEl = document.createElement('div');
          appleEl.className = 'apple';
          appleEl.textContent = val;
          appleEl.dataset.row = r;
          appleEl.dataset.col = c;
          appleEl.dataset.val = val;

          const appleObj = {
            id: `${r}-${c}`,
            row: r,
            col: c,
            value: val,
            cleared: false,
            element: appleEl
          };

          apples.push(appleObj);
          boardEl.appendChild(appleEl);
        }
      }

      startTimer();
    }

    // --- 타이머 처리 ---
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused && !isGameOver) {
          timeLeft--;
          timerDisplay.textContent = timeLeft;
          if (timeLeft <= 0) {
            endGame();
          }
        }
      }, 1000);
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.textContent = '▶ 재개하기';
        pauseModal.classList.add('active');
      } else {
        pauseBtn.textContent = '⏸ 일시정지';
        pauseModal.classList.remove('active');
      }
    }

    // --- 게임 오버 및 랭킹 ---
    function endGame() {
      clearInterval(timerInterval);
      isGameOver = true;
      finalScoreEl.textContent = `${score}점`;

      const isNewRecord = saveScore(score);
      highScoreMsg.textContent = isNewRecord ? '🎉 새로운 최고 기록 달성!' : '';

      gameoverModal.classList.add('active');
    }

    function saveScore(newScore) {
      const records = JSON.parse(localStorage.getItem('burger_game_rankings') || '[]');
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      records.push({ score: newScore, date: dateStr });
      records.sort((a, b) => b.score - a.score);
      const top5 = records.slice(0, 5);
      localStorage.setItem('burger_game_rankings', JSON.stringify(top5));
      return top5[0].score === newScore && newScore > 0;
    }

    function showRanking() {
      const records = JSON.parse(localStorage.getItem('burger_game_rankings') || '[]');
      rankingList.innerHTML = '';
      if (records.length === 0) {
        rankingList.innerHTML = '<li style="text-align:center; color:#8d6e63; padding:10px;">아직 기록이 없어요! 첫 도전을 해보세요 🍔</li>';
      } else {
        records.forEach((rec, idx) => {
          const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}위`;
          const li = document.createElement('li');
          li.className = 'rank-item';
          li.innerHTML = `<span>${medal} ${rec.date}</span><span><b>${rec.score}점</b></span>`;
          rankingList.appendChild(li);
        });
      }
      rankingModal.classList.add('active');
    }

    function hideModals() {
      pauseModal.classList.remove('active');
      gameoverModal.classList.remove('active');
      rankingModal.classList.remove('active');
    }

    // --- 버거 드래그 선택 로직 ---
    function getBoardCoords(e) {
      const rect = boardEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
        clientX,
        clientY
      };
    }

    function startDrag(e) {
      if (isPaused || isGameOver) return;
      if (e.type === 'touchstart' && e.touches.length > 1) return;

      isDragging = true;
      const coords = getBoardCoords(e);
      startX = coords.x;
      startY = coords.y;
      currentX = coords.x;
      currentY = coords.y;

      updateSelectionBox();
      updateSelectedApples();
    }

    function onDrag(e) {
      if (!isDragging || isPaused || isGameOver) return;
      const coords = getBoardCoords(e);
      currentX = coords.x;
      currentY = coords.y;

      updateSelectionBox();
      updateSelectedApples();
    }

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      selectBoxEl.style.display = 'none';
      sumIndicatorEl.style.display = 'none';

      const sum = selectedApples.reduce((acc, apple) => acc + apple.value, 0);

      if (sum === 10 && selectedApples.length > 0) {
        handleSuccess([...selectedApples]);
      }

      clearSelectedStyles();
      selectedApples = [];
    }

    function updateSelectionBox() {
      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      selectBoxEl.style.display = 'block';
      selectBoxEl.style.left = `${left}px`;
      selectBoxEl.style.top = `${top}px`;
      selectBoxEl.style.width = `${width}px`;
      selectBoxEl.style.height = `${height}px`;
    }

    function updateSelectedApples() {
      const selLeft = Math.min(startX, currentX);
      const selRight = Math.max(startX, currentX);
      const selTop = Math.min(startY, currentY);
      const selBottom = Math.max(startY, currentY);

      clearSelectedStyles();
      selectedApples = [];

      apples.forEach(apple => {
        if (apple.cleared) return;

        const el = apple.element;
        const elLeft = el.offsetLeft;
        const elTop = el.offsetTop;
        const elRight = elLeft + el.offsetWidth;
        const elBottom = elTop + el.offsetHeight;

        const isIntersecting = !(
          selRight < elLeft ||
          selLeft > elRight ||
          selBottom < elTop ||
          selTop > elBottom
        );

        if (isIntersecting) {
          apple.element.classList.add('selected');
          selectedApples.push(apple);
        }
      });

      if (selectedApples.length > 0) {
        const sum = selectedApples.reduce((acc, apple) => acc + apple.value, 0);
        sumIndicatorEl.style.display = 'block';
        sumIndicatorEl.style.left = `${currentX}px`;
        sumIndicatorEl.style.top = `${currentY}px`;
        sumIndicatorEl.textContent = `합: ${sum}`;

        if (sum === 10) {
          sumIndicatorEl.classList.add('is-ten');
          sumIndicatorEl.textContent = `합: 10! (놓으면 얌얌 🍔)`;
        } else {
          sumIndicatorEl.classList.remove('is-ten');
        }
      } else {
        sumIndicatorEl.style.display = 'none';
      }
    }

    function clearSelectedStyles() {
      apples.forEach(a => a.element.classList.remove('selected'));
    }

    function handleSuccess(clearedItems) {
      soundSuccess();
      const points = clearedItems.length;
      score += points;
      scoreDisplay.textContent = score;

      showToast(`+${points}점! 🍔`);

      clearedItems.forEach(apple => {
        apple.cleared = true;
        apple.element.classList.add('popping');
        setTimeout(() => {
          apple.element.classList.add('cleared');
          apple.element.classList.remove('popping');
        }, 300);
      });

      const remaining = apples.filter(a => !a.cleared).length;
      remainingDisplay.textContent = remaining;

      if (remaining === 0) {
        score += 50;
        scoreDisplay.textContent = score;
        endGame();
      }
    }

    function showToast(msg) {
      toastEffect.textContent = msg;
      toastEffect.classList.add('show');
      setTimeout(() => toastEffect.classList.remove('show'), 700);
    }

    // --- 이벤트 리스너 바인딩 ---
    boardEl.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);

    boardEl.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', onDrag, { passive: false });
    window.addEventListener('touchend', endDrag);

    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', initGame);
    playAgainBtn.addEventListener('click', initGame);
    rankBtn.addEventListener('click', showRanking);
    closeRankBtn.addEventListener('click', () => rankingModal.classList.remove('active'));

    // 게임 시작
    initGame();
  </script>
</body>
</html>
